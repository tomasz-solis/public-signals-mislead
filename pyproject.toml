[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-signals-mislead"
version = "0.1.0"
description = "Decision-support analysis of when public signals mislead product teams"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "praw>=7.7",
    "pytrends>=4.9",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "scipy>=1.10",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
apply-outcomes = "src.cli:apply_outcomes_main"
run-analysis = "src.analysis.statistical_analysis:main"
generate-viz = "src.cli:generate_viz_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
