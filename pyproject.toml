[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-signals-mislead"
version = "0.1.0"
description = "Analysis of whether public signals predict subscription feature success"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "praw>=7.7",
    "pytrends>=4.9",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "scipy>=1.10",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
