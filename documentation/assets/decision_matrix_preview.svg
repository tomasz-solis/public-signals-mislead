<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720"><rect width="1120" height="720" fill="#FAFBFC"/><rect x="32" y="28" width="1056" height="664" rx="22" fill="white" stroke="#D0D7DE"/><text x="215" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2C3E50">Decision Matrix: Public Signals Need Internal Context</text><text x="215" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#57606A">Use public signals to decide what to investigate next, not what to kill.</text><text x="342.5" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Low (&lt;30%)</text><text x="597.5" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Medium (30%-80%)</text><text x="852.5" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">High (&gt;80%)</text><text x="193" y="243.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Negative</text><text x="193" y="361.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Mixed</text><text x="193" y="479.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Positive</text><rect x="215" y="180" width="245" height="108" rx="18" fill="#FFE7E5" stroke="#D0D7DE"/><text x="337.5" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">INVESTIGATE</text><rect x="470" y="180" width="245" height="108" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="592.5" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">CHECK INTERNALS</text><rect x="725" y="180" width="245" height="108" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="847.5" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">DON'T AUTO-ROLLBACK</text><rect x="215" y="298" width="245" height="108" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="337.5" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">NEEDS CONTEXT</text><rect x="470" y="298" width="245" height="108" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="592.5" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">NEEDS CONTEXT</text><rect x="725" y="298" width="245" height="108" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="847.5" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">NEEDS CONTEXT</text><rect x="215" y="416" width="245" height="108" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="337.5" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">TRACK ADOPTION</text><rect x="470" y="416" width="245" height="108" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="592.5" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">DON'T AUTO-PANIC</text><rect x="725" y="416" width="245" height="108" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="847.5" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F">DON'T AUTO-PANIC</text><text x="96" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Reddit Sentiment</text><text x="215" y="624" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Before rollback, require:</text><text x="215" y="652" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57606A">adoption • repeat usage • retention effect • monetization where relevant • cost to maintain</text><rect x="772" y="568" width="242" height="74" rx="16" fill="#F6F8FA" stroke="#D0D7DE"/><text x="792" y="596" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#24292F">Rule of thumb</text><text x="792" y="621" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606A">External concern without internal</text><text x="792" y="642" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606A">evidence should trigger investigation,</text><text x="792" y="663" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606A">not an automatic rollback.</text></svg>