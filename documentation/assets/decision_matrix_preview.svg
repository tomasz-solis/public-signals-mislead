<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760"><rect width="1120" height="760" fill="#FAFBFC"/><rect x="32" y="28" width="1056" height="704" rx="22" fill="white" stroke="#D0D7DE"/><text x="228.0" y="66.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#2C3E50"><tspan x="228.0" dy="0.0">Decision Matrix:</tspan><tspan x="228.0" dy="30.0">Public Signals Need Internal Context</tspan></text><text x="228.0" y="114.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#57606A"><tspan x="228.0" dy="0.0">Use public signals to decide what to investigate next, not what to kill.</tspan></text><text x="340.0" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Low (&lt;30%)</text><text x="582.0" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Medium (30%-80%)</text><text x="824.0" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">High (&gt;80%)</text><text x="118.0" y="180.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F"><tspan x="118.0" dy="0.0">Reddit</tspan><tspan x="118.0" dy="18.8">sentiment</tspan></text><text x="206" y="240.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Negative</text><text x="206" y="362.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Mixed</text><text x="206" y="484.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F">Positive</text><rect x="228" y="184" width="224" height="104" rx="18" fill="#FFE7E5" stroke="#D0D7DE"/><text x="340.0" y="226.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="340.0" dy="0.0">INVESTIGATE</tspan></text><rect x="470" y="184" width="224" height="104" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="582.0" y="226.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="582.0" dy="0.0">CHECK</tspan><tspan x="582.0" dy="21.2">INTERNALS</tspan></text><rect x="712" y="184" width="224" height="104" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="824.0" y="226.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="824.0" dy="0.0">DON'T</tspan><tspan x="824.0" dy="21.2">AUTO-ROLLBACK</tspan></text><rect x="228" y="306" width="224" height="104" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="340.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="340.0" dy="0.0">NEEDS</tspan><tspan x="340.0" dy="21.2">CONTEXT</tspan></text><rect x="470" y="306" width="224" height="104" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="582.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="582.0" dy="0.0">NEEDS</tspan><tspan x="582.0" dy="21.2">CONTEXT</tspan></text><rect x="712" y="306" width="224" height="104" rx="18" fill="#FFF2CC" stroke="#D0D7DE"/><text x="824.0" y="348.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="824.0" dy="0.0">NEEDS</tspan><tspan x="824.0" dy="21.2">CONTEXT</tspan></text><rect x="228" y="428" width="224" height="104" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="340.0" y="470.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="340.0" dy="0.0">TRACK</tspan><tspan x="340.0" dy="21.2">ADOPTION</tspan></text><rect x="470" y="428" width="224" height="104" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="582.0" y="470.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="582.0" dy="0.0">DON'T</tspan><tspan x="582.0" dy="21.2">AUTO-PANIC</tspan></text><rect x="712" y="428" width="224" height="104" rx="18" fill="#E8F5E9" stroke="#D0D7DE"/><text x="824.0" y="470.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#24292F"><tspan x="824.0" dy="0.0">DON'T</tspan><tspan x="824.0" dy="21.2">AUTO-PANIC</tspan></text><text x="228.0" y="600.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#24292F"><tspan x="228.0" dy="0.0">Before rollback, require:</tspan></text><text x="228.0" y="628.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#57606A"><tspan x="228.0" dy="0.0">adoption • repeat usage • retention effect</tspan><tspan x="228.0" dy="17.5">monetization where relevant • cost to maintain</tspan></text><rect x="644" y="578" width="292" height="92" rx="16" fill="#F6F8FA" stroke="#D0D7DE"/><text x="664.0" y="606.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#24292F"><tspan x="664.0" dy="0.0">Rule of thumb</tspan></text><text x="664.0" y="632.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#57606A"><tspan x="664.0" dy="0.0">External concern without internal evidence</tspan><tspan x="664.0" dy="16.2">should trigger investigation, not rollback.</tspan></text></svg>